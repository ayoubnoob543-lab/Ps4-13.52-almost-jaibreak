name: "Sanity Check"

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"
  workflow_dispatch:

env:
  hen-bin: hen.bin

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check reproducible host environment
        shell: bash
        run: |
          set -euo pipefail
          bash tools/check_env.sh --ci
      - name: Build with PS4 Payload SDK
        uses: Scene-Collective/ps4-payload-sdk@46efae910f3705e0171edea5b94e572d01bc00e8
        with:
          app_path: .
          build_command: bash build.sh
      - name: Verify libkernel dump reproducibility
        shell: bash
        run: |
          set -euo pipefail
          test -f libkernel_sys_13.52.bin
          test -f lk_dump1.bin
          test -f lk_dump2.bin
          test -f lk_dump3.bin
          cat lk_dump1.bin lk_dump2.bin lk_dump3.bin > /tmp/libkernel_sys_13.52.reconstructed.bin
          cmp --silent /tmp/libkernel_sys_13.52.reconstructed.bin libkernel_sys_13.52.bin
          sha256sum libkernel_sys_13.52.bin lk_dump1.bin lk_dump2.bin lk_dump3.bin | tee analysis/ci_dump_hashes.txt
          sha256sum /tmp/libkernel_sys_13.52.reconstructed.bin | tee analysis/ci_reconstructed_hash.txt
          cmp --silent /tmp/libkernel_sys_13.52.reconstructed.bin libkernel_sys_13.52.bin
          echo "reconstruction_match=true" | tee analysis/ci_reconstruction_status.txt
          rm -f /tmp/libkernel_sys_13.52.reconstructed.bin
      - name: Run static libkernel audit
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_static_audit.sh 2>&1 | tee analysis/ci_static_audit.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("analysis/verify_offsets.json").read_text())
          assert result["combined"]["sha256_match"] is True
          assert result["concatenation"]["matches_combined"] is True
          assert result["static_only"] is True
          assert Path("analysis/xref_version_analysis_13.52.json").stat().st_size > 0
          assert Path("analysis/xref_version_analysis_13.52.txt").stat().st_size > 0
          print("static_audit_assertions=true")
          PY
      - name: Static source quality checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n build.sh tools/run_static_audit.sh
          node --check jordy_stage2.js
          python3 tools/check_source_quality.py

      - name: Upload static audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-audit-${{ github.run_id }}
          if-no-files-found: error
          path: |
            analysis/verify_offsets.json
            analysis/xref_version_analysis_13.52.txt
            analysis/xref_version_analysis_13.52.json
            analysis/hash_inventory.txt
            analysis/concatenation_sha256.txt
            analysis/ci_dump_hashes.txt
            analysis/ci_reconstructed_hash.txt
            analysis/ci_reconstruction_status.txt
            analysis/ci_static_audit.log
            analysis/ci_environment.txt
      - name: Upload payload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.hen-bin }}
          path: ${{ env.hen-bin }}
      - name: Determine release type and tag
        if: github.event_name != 'pull_request'
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            latest_tag=$(gh release view --json tagName --jq .tagName || echo "")
            if [ -z "$latest_tag" ]; then
              tag_name="pre-release-${GITHUB_REF##*/}-${GITHUB_RUN_NUMBER}"
            else
              tag_name="${latest_tag}-pre-release-${GITHUB_RUN_NUMBER}"
            fi
            echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag_name=$tag_name"
          fi
      - name: Create GitHub release
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.vars.outputs.tag_name }}" "${{ env.hen-bin }}" --clobber
      - name: Create GitHub pre-release
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_release != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.vars.outputs.tag_name }}" "${{ env.hen-bin }}" --target ${{ github.sha }} -t "${{ steps.vars.outputs.tag_name }}" -p --generate-notes
